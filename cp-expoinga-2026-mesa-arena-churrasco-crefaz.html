<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crefaz | Mesa Arena Churrasco Crefaz Expoingá 2026</title>

    <link rel="shortcut icon" href="assets/favicon-crefaz.ico" type="image/x-icon">
</head>

<!-- Global styles -->
<style>
    @font-face {
        font-family: 'Anteb';
        src: url('https://site.crefaz.com.br/parcerias/fonts/Anteb-Regular.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'Anteb';
        src: url('https://site.crefaz.com.br/parcerias/fonts/Anteb-ExtraBold.otf') format('opentype');
        font-weight: bold;
        font-style: normal;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        scroll-behavior: smooth;
        font-family: 'Anteb', sans-serif;
        overflow-x: hidden;
    }


    .input-success {
        border: 2px solid #22c55e !important;
    }

    .input-error {
        border: 2px solid #ef4444 !important;
    }

    .error-label {
        color: #ef4444;
        font-size: 11px;
        margin-top: 4px;
        font-weight: 600;
        display: none;
    }

    ::selection {
        background: #4dbeffbb;
        color: #ffffff;
    }

    strong {
        font-weight: 800;
    }

    .btn {
        border: none;
        border-radius: 10px;
        padding: 10px;
        cursor: pointer;
        font-size: 28px;
        font-family: 'Anteb', sans-serif;
        height: 80px;
        align-content: center;
        text-decoration: none;
        text-align: center;
    }

    .btn-primary {
        background: #163056;
        color: #fff;
        width: 100%;
    }

    .btn-primary-outline {
        background: transparent;
        border: 2px solid #163056;
        color: #163056;
        text-decoration: none;
        width: 100%;
        text-align: center;
    }

    .btn-secondary {
        background: #EF6B22;
        color: #fff;
        width: 100%;
    }

    .btn-secondary-outline {
        background: transparent;
        border: 2px solid #EF6B22;
        color: #EF6B22;
        text-decoration: none;
        width: 100%;
        text-align: center;
        transition: all 0.1s ease;
        align-items: center;
        display: flex;
    }

    .btn-secondary-outline:hover {
        background: #ef6b22;
        color: #fff;
    }

    .btn-primary:hover {
        filter: brightness(1.2);
    }

    .btn-secondary:hover {
        filter: brightness(0.9);
    }
</style>

<body>

    <!-- hero -->
    <section id="hero">
        <style>
            #hero {
                font-family: 'Anteb', sans-serif;
                background: #163056;
                display: grid;
                align-items: center;
                grid-template-columns: 1fr;
                justify-content: center;
                min-height: 600px;
            }

            h1,
            h2 {
                font-size: 85px;
                margin: 0;
                padding: 0;
                font-weight: 400;
                text-align: left;
                line-height: 1.1;
                letter-spacing: -1px;
                color: #fff;
            }

            .credit-content {
                background: #ef6b22;
            }

            .logo-crefaz {
                width: 250px;
                margin: 0 auto;
                fill: #fff;
                display: none;
            }

            .card-text {
                display: grid;
                gap: 20px;
                max-width: 500px;
            }

            .menu-content,
            .credit-content {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 60px 30px;
                height: 100%;
            }

            .credit-content {
                gap: 40px;
            }

            .menu-content {
                background: #432918;
                gap: 40px;
            }

            .logo-arena {
                max-width: 300px;
                margin: 0 auto;
            }

            .btn-confirmation {
                background: transparent;
                color: #ffffff;
                border: 2px solid;
                text-align: center;
                text-decoration: none;
                min-width: 350px;
                margin: 0 auto;
            }


            .btn-confirmation:hover {
                background: transparent;
                color: #fff;
                border: 2px solid;
                fill: #fff;
            }

            .content-image {
                background: #ef6b22;
                position: relative;
            }

            .content-image .container {
                display: grid;
                grid-template-columns: 0.9fr 1fr;
                align-items: center;
                justify-content: center;
                height: 100%;
                gap: 20px;
                padding: 60px 30px;
            }

            .content-text {
                color: #fff;
                padding: 30px 0;
            }

            .content-text p {
                margin: 0;
                padding: 0;
            }

            .iphone {
                pointer-events: none;
                max-width: 300px;
                margin: 0 auto;
            }

            .content-form {
                position: relative;
                display: grid;
            }


            .iphone img {
                width: 100%;
            }

            @media (max-width: 767px) {

                h1 {
                    font-size: 65px;
                    text-align: center;
                }

                h2 {
                    font-size: 28px;
                }

                .logo-crefaz {
                    width: 200px;
                    display: none;
                }

                .logo-arena {
                    max-width: 250px;
                }

                .card-text {
                    display: grid;
                    gap: 20px;
                }

                .btn-confirmation {
                    min-width: 320px;
                    height: 70px;
                }

                .content-image {
                    grid-template-columns: 1fr;
                }

                .iphone {
                    max-width: 220px;
                }

                .content-image .container {
                    grid-template-columns: 1fr;
                    gap: 0;
                }
            }
        </style>
