<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crefaz | Mesa Arena Churrasco Crefaz Expoingá 2026</title>

    <link rel="shortcut icon" href="assets/favicon-crefaz.ico" type="image/x-icon">
</head>

<body>

    <!-- hero -->
    <section id="hero">
        <!-- Global styles -->
        <style>
            html {
                --azul-escuro: #0d2041;
                --azul-crefaz: #163056;
                --laranja-crefaz: #ef6b22;
            }

            @font-face {
                font-family: 'Anteb';
                src: url('https://site.crefaz.com.br/parcerias/fonts/Anteb-Regular.otf') format('opentype');
                font-weight: normal;
                font-style: normal;
            }

            @font-face {
                font-family: 'Anteb';
                src: url('https://site.crefaz.com.br/parcerias/fonts/Anteb-ExtraBold.otf') format('opentype');
                font-weight: bold;
                font-style: normal;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 0;
                scroll-behavior: smooth;
                font-family: 'Anteb', sans-serif;
                overflow-x: hidden;
            }


            .input-success {
                border: 2px solid #22c55e !important;
            }

            .input-error {
                border: 2px solid #ef4444 !important;
            }

            .error-label {
                color: #ef4444;
                font-size: 11px;
                margin-top: 4px;
                font-weight: 600;
                display: none;
            }

            ::selection {
                background: #4dbeffbb;
                color: #ffffff;
            }

            strong {
                font-weight: 800;
            }

            .btn {
                border: none;
                border-radius: 10px;
                padding: 10px;
                cursor: pointer;
                font-size: 28px;
                font-family: 'Anteb', sans-serif;
                height: 80px;
                align-content: center;
                text-decoration: none;
                text-align: center;
            }

            .btn-primary {
                background: #163056;
                color: #fff;
                width: 100%;
            }

            .btn-primary-outline {
                background: transparent;
                border: 2px solid #163056;
                color: #163056;
                text-decoration: none;
                width: 100%;
                text-align: center;
            }

            .btn-secondary {
                background: #EF6B22;
                color: #fff;
                width: 100%;
            }

            .btn-secondary-outline {
                background: transparent;
                border: 2px solid #EF6B22;
                color: #EF6B22;
                text-decoration: none;
                width: 100%;
                text-align: center;
                transition: all 0.1s ease;
                align-items: center;
                display: flex;
            }

            .btn-secondary-outline:hover {
                background: #ef6b22;
                color: #fff;
            }

            .btn-primary:hover {
                filter: brightness(1.2);
            }

            .btn-secondary:hover {
                filter: brightness(0.9);
            }
        </style>
        <style>
            #hero {
                font-family: 'Anteb', sans-serif;
                background: #163056;
                display: grid;
                align-items: center;
                grid-template-columns: 1fr;
                justify-content: center;
                min-height: 600px;
            }

            h1 {
                font-size: 70px;
                margin: 0;
                padding: 0;
                font-weight: 600;
                text-align: left;
                line-height: 1.1;
                letter-spacing: -1px;
                color: #fff;
                text-transform: uppercase;
            }

            h2 {
                font-size: 85px;
                margin: 0;
                padding: 0;
                font-weight: 400;
                text-align: left;
                line-height: 1.1;
                letter-spacing: -1px;
                color: #fff;
            }

            .credit-content {
                background: #ef6b22;
            }

            .logo-crefaz {
                width: 250px;
                margin: 0 auto;
                fill: #fff;
                display: none;
            }

            .card-text {
                display: grid;
                gap: 20px;
                max-width: 500px;
            }

            .menu-content,
            .credit-content {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 60px 30px;
                height: 100%;
            }

            .credit-content {
                gap: 40px;
            }

            .menu-content {
                background: #432918;
                gap: 40px;
            }

            .logo-arena {
                max-width: 300px;
                margin: 0 auto;
            }

            .btn-confirmation {
                background: transparent;
                color: #ffffff;
                border: 2px solid;
                text-align: center;
                text-decoration: none;
                min-width: 350px;
                margin: 0 auto;
            }


            .btn-confirmation:hover {
                background: transparent;
                color: #fff;
                border: 2px solid;
                fill: #fff;
            }

            .content-image {
                background: var(--laranja-crefaz);
                position: relative;
                display: grid;
                grid-template-columns: 0.6fr 1fr;
                align-items: center;
                padding: 10px 30px;
                justify-content: center;
                background: #163056;
                border-radius: 30px;
                height: 280px;
                max-width: 800px;
            }

            .content-image .container {
                display: grid;
                grid-template-columns: 0.9fr 1fr;
                align-items: center;
                justify-content: center;
                height: 100%;
                gap: 20px;
                padding: 60px 30px;
            }

            .content-text {
                color: #fff;
                padding: 30px 0;
            }

            .content-text p {
                margin: 0;
                padding: 0;
            }

            .iphone {
                pointer-events: none;
                position: absolute;
                max-width: 250px;
                top: -50px;
                left: 20px;
            }

            .iphone img {
                width: 100%;
            }

            @media (max-width: 767px) {

                h1 {
                    font-size: 28px;
                    line-height: 1.1;
                    text-align: left;
                }

                h2 {
                    font-size: 28px;
                }

                .logo-crefaz {
                    width: 200px;
                    display: none;
                }

                .logo-arena {
                    max-width: 250px;
                }

                .card-text {
                    display: grid;
                    gap: 20px;
                }

                .btn-confirmation {
                    min-width: 320px;
                    height: 70px;
                }

                .content-image {
                    width: 100%;
                    grid-template-columns: 0.7fr 1fr;
                    height: fit-content;
                    margin: 20px 0;
                    padding: 0;
                }

                .iphone {
                    max-width: 130px;
                    left: 0;
                    top: -30px;
                }

                .content-image .container {
                    grid-template-columns: 1fr;
                    gap: 0;
                }
            }
        </style>

        <div class="menu-content">

            <!-- <img class="logo-arena" src="assets/logo-crefaz-arena.png" alt="Logo Complexo Arena Crefaz"
                title="Logo Complexo Arena Crefaz"> -->

            <img class="logo-arena"

                Ver cardápio
            </a>
        </div>

            <div class="content-image">
                <div class="content-iphone">
                    <div class="iphone">
                        <!-- <img src="assets/iphone-17-dois-celulares-celular.png" alt="iPhone 17" class="iPhone 17"> -->
                        <img src="https://image.parceiros.crefaz.com.br/lib/fe3711737164057b751772/m/1/677ffe06-c94d-4519-9ae3-bc33dc1e1049.png"
                            alt="iPhone 17" class="iPhone 17">
                    </div>

                </div>
                <div class="content-text">
                    <h1>Quer ganhar <br>um iPhone 17?</h1>
                </div>
            </div>
            <a href="https://site.crefaz.com.br/expoinga" class="btn btn-confirmation">
                Clique e participe
            </a>
        </div>

    </section>

    <!-- rodapé -->
    <section id="rodape">
        <style>
            #rodape {
                font-family: 'Anteb', sans-serif;
                /* background: #0d2041; */
                background: #163056;
                color: #fff;
            }

            .footer-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 30px;
                max-width: 1000px;
                margin: 0 auto;
                padding: 40px 0px;
            }

            .logo-footer {
                width: 130px;
                fill: #fff;
            }

            .footer-section {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: start;
                gap: 20px;
            }

            .footer-title {
                font-size: 16px;
                font-weight: 400;
                color: #778fb3;
            }

            .footer-text {
                font-size: 14px;
                color: #ffffff;
                line-height: 1.5;
            }

            .social-icons {
                display: flex;
                gap: 10px;
                align-items: center;
                justify-content: end;
            }

            .security-icons {
                display: flex;
                align-items: center;
                gap: 20px;
            }

            .security-icons img {
                width: 110px;
            }

            .security-imgs {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
                align-items: center;
                justify-content: center;
            }

            .icon-social {
                background: #163056;
                width: 38px;
                fill: #ffffff;
                border-radius: 10px;
                padding: 6px;
                transition: all 0.2s ease;
            }

            .icon-social:hover {
                fill: #fff;
                background: #27436d;
                transform: translatey(-1px);
            }

            .privacity {
                display: flex;
                gap: 20px;
                align-items: center;
                justify-content: end;
            }

            .footer-container a {
                font-size: 14px;
                color: #778fb3;
                text-decoration: none;
                transition: all 0.3s ease;
            }

            .footer-section a {
                font-size: 18px;
            }

            .footer-section a:hover,
            .footer-container a:hover {
                color: #fff;
                text-decoration: underline;
            }

            #msg-footer {
                color: #778fb3;
                padding: 18px;
                text-align: center;
                border-top: 1px solid #657a992e;
                line-height: 1.5;
            }

            #msg-footer p {
                margin: 0;
                padding: 0;
                font-family: 'Anteb', sans-serif;
                font-size: 12px;
            }

            @media (max-width: 768px) {
                .footer-container {
                    grid-template-columns: 1fr;
                    align-items: center;
                    justify-content: center;
                }

                .logo-footer {
                    padding: 0;
                }

                .social-icons {
                    justify-content: center;
                }

                .footer-section {
                    justify-content: center;
                    align-items: center;
                }

                .privacity {
                    flex-direction: column;
                    gap: 8px;
                }

                .security-icons {
                    flex-direction: column;
                    gap: 10px;
                }

                #msg-footer p {
                    font-size: 10px;
                }
            }
        </style>
