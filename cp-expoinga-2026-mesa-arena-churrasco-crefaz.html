<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crefaz | Mesa Arena Churrasco Crefaz Expoingá 2026</title>

    <link rel="shortcut icon" href="assets/favicon-crefaz.ico" type="image/x-icon">
</head>



<body>

    <!-- hero -->
    <section id="hero">

        <!-- Global styles -->
        <style>
            html {
                --azul-escuro: #0d2041;
                --azul-crefaz: #163056;
                --laranja-crefaz: #ef6b22;
            }

            @font-face {
                font-family: 'Anteb';
                src: url('https://site.crefaz.com.br/parcerias/fonts/Anteb-Regular.otf') format('opentype');
                font-weight: normal;
                font-style: normal;
            }

            @font-face {
                font-family: 'Anteb';
                src: url('https://site.crefaz.com.br/parcerias/fonts/Anteb-ExtraBold.otf') format('opentype');
                font-weight: bold;
                font-style: normal;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 0;
                scroll-behavior: smooth;
                font-family: 'Anteb', sans-serif;
                overflow-x: hidden;
            }


            .input-success {
                border: 2px solid #22c55e !important;
            }

            .input-error {
                border: 2px solid #ef4444 !important;
            }

            .error-label {
                color: #ef4444;
                font-size: 11px;
                margin-top: 4px;
                font-weight: 600;
                display: none;
            }

            ::selection {
                background: #4dbeffbb;
                color: #ffffff;
            }

            strong {
                font-weight: 800;
            }

            .btn {
                border: none;
                border-radius: 10px;
                padding: 10px;
                cursor: pointer;
                font-size: 24px;
                font-family: 'Anteb', sans-serif;
                height: 80px;
                align-content: center;
                text-decoration: none;
                text-align: center;
            }

            .btn-outline {
                background: transparent;
                color: #ffffff;
                border: 2px solid #fff;
                text-align: center;
                text-decoration: none;
                width: 350px;
                margin: 0 auto;
            }

            .btn-outline:hover {
                background: #ffffff;
                color: #ef6b22;
                border: 2px solid #ffffff;
                transform: translateY(-2px);
            }

            .btn-primary {
                background: var(--azul-crefaz);
                color: #ffffff;
                text-align: center;
                text-decoration: none;
                width: 350px;
                margin: 0 auto;
            }

            .btn-primary:hover {
                background: var(--azul-escuro);
                color: #ffffff;
                transform: translateY(-2px);
            }


            .highlight {
                color: #ef6b22;
                font-weight: 800;
            }

            p {
                margin: 0;
                padding: 0;
            }
        </style>

        <style>
            #hero {
                font-family: 'Anteb', sans-serif;
                background: var(--azul-crefaz);
                align-items: center;
            }

            .credit-content .container {
                position: relative;
                display: grid;
                grid-template-columns: 1fr 0.8fr;
                align-items: center;
                padding: 5px;
                justify-content: center;
                border-radius: 30px;
                max-width: 900px;
                margin: 0 auto;
            }

            .logo-crefaz {
                width: 250px;
                margin: 0 auto;
                fill: #fff;
                display: none;
            }

            .card-text {
                display: grid;
                gap: 20px;
                max-width: 500px;
            }

            .menu-content {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 60px 20px;
                height: 100%;
            }

            .credit-content {
                background: var(--laranja-crefaz);
                padding: 60px 20px;
                height: 100%;
                gap: 20px;
                display: grid;
            }

            .menu-content {
                background: #432918;
                gap: 40px;
            }

            .logo-arena {
                max-width: 300px;
                margin: 0 auto;
            }

            .content-form {
                position: relative;
                display: grid;
            }

            .content-text {
                display: flex;
                flex-direction: column;
                align-items: start;
                justify-content: start;
            }

            .content-text h1 {
                font-size: 75px;
                color: #fff;
                padding: 20px 0;
                margin: 0;
                text-align: left;
                line-height: 1;
                text-transform: uppercase;
            }

            .iphone {
                pointer-events: none;
                max-width: 250px;
            }

            .iphone img {
                width: 100%;
            }

            @media (max-width: 767px) {

                .credit-content .container {
                    grid-template-columns: 1.2fr 0.8fr;
                    gap: 10px;
                }

                .content-text h1 {
                    font-size: 28px;
                    text-align: left;
                    padding: 0 0 5px 0;
                }

                h2 {
                    font-size: 28px;
                }

                .logo-crefaz {
                    width: 200px;
                    display: none;
                }

                .logo-arena {
                    max-width: 250px;
                }

                .card-text {
                    display: grid;
                    gap: 20px;
                }

                .btn-outline {
                    width: 300px;
                    height: 70px;
                }

                .btn-primary {
                    width: 300px;
                    height: 70px;
                }

                .iphone {
                    max-width: 220px;
                    margin: 0 auto;
                }

                .iphone img {
                    width: 100px;
                }


            }
        </style>

        <div class="menu-content">
            <img class="logo-arena"
                src="https://image.parceiros.crefaz.com.br/lib/fe3711737164057b751772/m/1/d080ab8c-68af-4270-9584-da2987140841.png"
                alt="Logo Complexo Arena Crefaz" title="Logo Complexo Arena Crefaz">
            <a href="#" class="btn btn-outline">
                Ver cardápio
            </a>
        </div>

        <div class="credit-content">
            <div class="container">
                <div class="content-text">
                    <h1>Quer ganhar <br>um iPhone 17?</h1>
                </div>
                <div class="iphone">
                    <img src="https://image.parceiros.crefaz.com.br/lib/fe3711737164057b751772/m/1/5db551a6-528d-46cd-8219-74f97531a93c.png"
                        alt="iPhone 17" class="iPhone 17">
                </div>
            </div>
            <a href="https://site.crefaz.com.br/expoinga" class="btn btn-primary">
                Clique e participe
            </a>
        </div>

    </section>

    <!-- rodapé -->
    <section id="rodape">
        <style>
            #rodape {
                font-family: 'Anteb', sans-serif;
                /* background: #0d2041; */
                background: #163056;
                color: #fff;
            }

            .footer-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 30px;
                max-width: 1000px;
                margin: 0 auto;
                padding: 40px 0px;
            }

            .logo-footer {
                width: 130px;
                fill: #fff;
            }

            .footer-section {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: start;
                gap: 20px;
            }

            .footer-title {
                font-size: 16px;
                font-weight: 400;
                color: #778fb3;
            }

            .footer-text {
                font-size: 14px;
                color: #ffffff;
                line-height: 1.5;
            }

            .social-icons {
                display: flex;
                gap: 10px;
                align-items: center;
                justify-content: end;
            }

            .security-icons {
                display: flex;
                align-items: center;
                gap: 20px;
            }

            .security-icons img {
                width: 110px;
            }

            .security-imgs {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
                align-items: center;
                justify-content: center;
            }

            .icon-social {
                background: #163056;
                width: 38px;
                fill: #ffffff;
                border-radius: 10px;
                padding: 6px;
                transition: all 0.2s ease;
            }

            .icon-social:hover {
                fill: #fff;
                background: #27436d;
                transform: translatey(-1px);
            }

            .privacity {
                display: flex;
                gap: 20px;
                align-items: center;
                justify-content: end;
            }

            .footer-container a {
                font-size: 14px;
                color: #778fb3;
                text-decoration: none;
                transition: all 0.3s ease;
            }

            .footer-section a {
                font-size: 18px;
            }

            .footer-section a:hover,
            .footer-container a:hover {
                color: #fff;
                text-decoration: underline;
            }

            #msg-footer {
                color: #778fb3;
                padding: 18px;
                text-align: center;
                border-top: 1px solid #657a992e;
                line-height: 1.5;
            }

            #msg-footer p {
                margin: 0;
                padding: 0;
                font-family: 'Anteb', sans-serif;
                font-size: 12px;
            }

            @media (max-width: 768px) {
                .footer-container {
                    grid-template-columns: 1fr;
                    align-items: center;
                    justify-content: center;
                }

                .logo-footer {
                    padding: 0;
                }

                .social-icons {
                    justify-content: center;
                }

                .footer-section {
                    justify-content: center;
                    align-items: center;
                }

                .privacity {
                    flex-direction: column;
                    gap: 8px;
                }

                .security-icons {
                    flex-direction: column;
                    gap: 10px;
                }

                #msg-footer p {
                    font-size: 10px;
                }
            }
        </style>
