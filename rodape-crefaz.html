<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crefaz | Mesa Arena Churrasco Crefaz Expoingá 2026</title>

    <link rel="shortcut icon" href="assets/favicon-crefaz.ico" type="image/x-icon">
</head>

<!-- Global styles -->
<style>
    html {
        --azul-escuro: #0d2041;
        --azul-crefaz: #163056;
        --laranja-crefaz: #ef6b22;
        --text-footer: #778fb3;
    }

    @font-face {
        font-family: 'Anteb';
        src: url('https://site.crefaz.com.br/parcerias/fonts/Anteb-Regular.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'Anteb';
        src: url('https://site.crefaz.com.br/parcerias/fonts/Anteb-ExtraBold.otf') format('opentype');
        font-weight: bold;
        font-style: normal;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        scroll-behavior: smooth;
        font-family: 'Anteb', sans-serif;
        overflow-x: hidden;
    }


    .input-success {
        border: 2px solid #22c55e !important;
    }

    .input-error {
        border: 2px solid #ef4444 !important;
    }

    .error-label {
        color: #ef4444;
        font-size: 11px;
        margin-top: 4px;
        font-weight: 600;
        display: none;
    }

    ::selection {
        background: #4dbeffbb;
        color: #ffffff;
    }

    strong {
        font-weight: 800;
    }

    .btn {
        border: none;
        border-radius: 10px;
        padding: 10px;
        cursor: pointer;
        font-size: 28px;
        font-family: 'Anteb', sans-serif;
        height: 80px;
        align-content: center;
        text-decoration: none;
        text-align: center;
    }

    .btn-primary {
        background: #163056;
        color: #fff;
        width: 100%;
    }

    .btn-primary-outline {
        background: transparent;
        border: 2px solid #163056;
        color: #163056;
        text-decoration: none;
        width: 100%;
        text-align: center;
    }

    .btn-secondary {
        background: #EF6B22;
        color: #fff;
        width: 100%;
    }

    .btn-secondary-outline {
        background: transparent;
        border: 2px solid #EF6B22;
        color: #EF6B22;
        text-decoration: none;
        width: 100%;
        text-align: center;
        transition: all 0.1s ease;
        align-items: center;
        display: flex;
    }

    .btn-secondary-outline:hover {
        background: #ef6b22;
        color: #fff;
    }

    .btn-primary:hover {
        filter: brightness(1.2);
    }

    .btn-secondary:hover {
        filter: brightness(0.9);
    }
</style>

<body>

    <!-- rodapé -->
    <section id="rodape">
        <style>
            #rodape {
                font-family: 'Anteb', sans-serif;
                /* background: #0d2041; */
                background: #163056;
                color: #fff;
            }

            .footer-container {
                display: grid;
                grid-template-columns: 1fr;
                gap: 40px;
                max-width: 1000px;
                margin: 0 auto;
                padding: 40px 0px;
            }

            .footer-container a {
                color: var(--text-footer);
                text-decoration: none;
            }

            .footer-section {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 20px;
            }

            .logo-footer {
                width: 120px;
                fill: #fff;
            }

            .footer-title {
                font-size: 16px;
                font-weight: 400;
                color: #778fb3;
            }

            .footer-text {
                font-size: 14px;
                color: #ffffff;
                line-height: 1.5;
            }

            .security-icons {
                display: flex;
                align-items: center;
                gap: 20px;
            }

            .security-icons img {
                width: 110px;
            }

            .security-imgs {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
                align-items: center;
                justify-content: center;
            }

            /*---------------------------------------------*/
            /*----------------REDES SOCIAIS----------------*/
            /*---------------------------------------------*/

            .crefazoficial {
                display: flex;
                gap: 8px;
                align-items: center;
                justify-content: end;
            }

            .crefazoficial p {
                font-size: 20px;
                margin: 0;
                padding: 0;
                font-weight: 300;
            }

            .social-icons {
                display: flex;
                gap: 6px;
                align-items: center;
                justify-content: end;
            }

            .icon-social {
                background: var(--azul-crefaz);
                width: 22px;
                fill: #ffffff;
                padding: 2px;
                transition: all 0.2s ease;
            }

            .icon-social:hover {
                fill: var(--laranja-crefaz);
                transform: translatey(-1px);
            }

            .privacity {
                display: flex;
                gap: 20px;
                align-items: center;
                justify-content: end;
            }

            /* .footer-section {
                justify-content: center;
                align-items: center;
                flex-direction: column;
                gap: 30px;
            } */

            .footer-section a {
                font-size: 18px;
                height: 22px;
                color: #fff;
                text-decoration: none;
                transition: all 0.3s ease;
                font-weight: 300;
            }

            .footer-section a:hover,
            .footer-container a:hover {
                color: #fff;
                text-decoration: underline;
            }

            .content-enterprise {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            #msg-footer {
                color: var(--text-footer);
                padding: 18px 40px;
                text-align: center;
                border-top: 1px solid #657a992e;
                line-height: 1.5;
                text-transform: uppercase;
            }

            #msg-footer p {
                margin: 0;
                padding: 0;
                font-family: 'Anteb', sans-serif;
                font-size: 12px;
            }

            @media (max-width: 768px) {
                .footer-container {
                    grid-template-columns: 1fr;
                    align-items: center;
                    justify-content: center;
                }

                .logo-footer {
                    padding: 0;
                }

                .social-icons {
                    justify-content: center;
                }

                .footer-section {
                    justify-content: center;
                    /* flex-wrap: wrap; */
                    flex-direction: column;
                    gap: 30px;
                }

                .content-enterprise {
                    flex-direction: column;
                    gap: 40px;
                }

                .privacity {
                    flex-direction: column;
                    gap: 10px;
                }

                .security-icons {
                    flex-direction: column;
                    gap: 10px;
                }

                #msg-footer p {
                    font-size: 10px;
                }
            }
        </style>
